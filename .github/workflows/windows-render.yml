name: Windows render verification

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

# Throwaway repro (not for main): the reported full-range 60 fps clip on Windows, released CLI and this ref.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref"
        required: false
        default: ""

jobs:
  extract-repro:
    name: Windows extraction repro
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg-windows
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install and build the CLI from this ref
        shell: pwsh
        run: |
          bun install --frozen-lockfile --linker=hoisted
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
          bun run --filter @hyperframes/player build
          bun run --filter @hyperframes/studio build
          bun run --filter @hyperframes/inspector build
          bun run --filter @hyperframes/cli build
      - name: Render the reported clip
        shell: pwsh
        env:
          HYPERFRAMES_SKIP_SKILLS: "1"
          NO_COLOR: "1"
        run: |
          $fixture = "$env:GITHUB_WORKSPACE\.github\workflows\fixtures\win-extract-repro"
          $clip = "Screen Recording 2026-10-27 at 10.12.03.mp4"
          $variants = @(
            @{ name = "spaces-yuvj420p"; dir = "$env:RUNNER_TEMP\My Projects\Demo Film"; pix = "yuvj420p"; range = "pc" },
            @{ name = "nospace-yuvj420p"; dir = "C:\xr\proj"; pix = "yuvj420p"; range = "pc" },
            @{ name = "spaces-yuv420p"; dir = "$env:RUNNER_TEMP\My Projects\Tv Range"; pix = "yuv420p"; range = "tv" }
          )
          foreach ($v in $variants) {
            New-Item -ItemType Directory -Force -Path "$($v.dir)\compositions" | Out-Null
            Copy-Item "$fixture\index.html" $v.dir -Force
            Copy-Item "$fixture\compositions\*.html" "$($v.dir)\compositions" -Force
            Copy-Item "$env:GITHUB_WORKSPACE\node_modules\gsap\dist\gsap.min.js" $v.dir -Force
            & ffmpeg -v error -y -f lavfi -i "testsrc2=size=1644x1080:rate=60:duration=20" -c:v libx264 -profile:v high -pix_fmt $v.pix -color_range $v.range -an "$($v.dir)\$clip"
            & ffprobe -v error -select_streams v:0 -show_entries stream=profile,pix_fmt,color_range,r_frame_rate -of compact "$($v.dir)\$clip"
          }
          function Render($label, $dir, $cli) {
            Push-Location $dir
            $log = "$env:RUNNER_TEMP\$label.log"
            if ($cli) { & node $cli render --output "$env:RUNNER_TEMP\$label.mp4" --quality draft *> $log }
            else { & npx.cmd --yes hyperframes@0.8.207 render --output "$env:RUNNER_TEMP\$label.mp4" --quality draft *> $log }
            $code = $LASTEXITCODE
            Pop-Location
            Write-Host "===== $label exit=$code"
            Get-Content $log | Select-String -Pattern "extraction|VIDEO_|ffmpeg said|Error|error|Render complete|rendered in" | Select-Object -First 12 | ForEach-Object { Write-Host $_.Line }
          }
          foreach ($v in $variants) { Render "released-$($v.name)" $v.dir $null }
          Render "branch-spaces-yuvj420p" $variants[0].dir "$env:GITHUB_WORKSPACE\packages\cli\dist\cli.js"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-extract-repro-logs
          path: ${{ runner.temp }}/*.log
